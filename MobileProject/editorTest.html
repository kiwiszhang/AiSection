<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Toast UI Editor iOS Custom Toolbar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
<style>
html, body {
  margin:0; padding:0; height:100%; overflow:hidden;
}
#toolbar {
  display: flex;
  flex-wrap: wrap;
  background: #f5f5f5;
  padding: 4px;
  border-bottom:1px solid #ccc;
}
#toolbar button { margin-right:4px; padding:4px 8px; font-size:16px; }
#toolbar input[type=color] { width:36px; height:28px; margin-left:4px; padding:0; }
#editor { height: calc(100% - 48px); width:100%; }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="exec('bold')">B</button>
  <button onclick="exec('italic')">I</button>
  <button onclick="exec('underline')">U</button>
  <button onclick="exec('ul')">UL</button>
  <button onclick="exec('ol')">OL</button>
  <button onclick="exec('indent')">→</button>
  <button onclick="exec('outdent')">←</button>
  <input type="color" onchange="exec('foreColor', this.value)" />
  <button onclick="exec('heading',1)">H1</button>
  <button onclick="exec('heading',2)">H2</button>
  <button onclick="exec('heading',3)">H3</button>
</div>

<div id="editor"></div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor.min.js"></script>
<script>
let editor = null;

document.addEventListener("DOMContentLoaded", function() {
  editor = new toastui.Editor({
    el: document.querySelector('#editor'),
    initialEditType: 'wysiwyg',
    previewStyle: 'vertical',
    usageStatistics: false,
    height: '100%',
    toolbarItems: [],    // 隐藏默认工具栏
    hideModeSwitch: true // 隐藏 WYSIWYG/Markdown 切换
  });
});

// 全局函数供自定义 toolbar 调用
function exec(command, param) {
  if(!editor) return;
  switch(command){
    case 'bold': editor.toggleBold(); break;
    case 'italic': editor.toggleItalic(); break;
    case 'underline': editor.toggleUnderline(); break;
    case 'ul': editor.toggleBulletList(); break;
    case 'ol': editor.toggleOrderedList(); break;
    case 'indent': editor.indent(); break;
    case 'outdent': editor.outdent(); break;
    case 'heading': editor.toggleHeading(param); break;
    case 'foreColor': editor.setTextColor(param); break;
  }
}

// iOS 调用接口
window.getHTML = () => editor ? editor.getHTML() : '';
window.setHTML = (html) => { if(editor) editor.setHTML(html); };
window.getMarkdown = () => editor ? editor.getMarkdown() : '';
window.setMarkdown = (md) => { if(editor) editor.setMarkdown(md); };
</script>

</body>
</html>
